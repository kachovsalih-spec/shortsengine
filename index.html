<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortsEngine AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
                ShortsEngine AI 🚀
            </h1>
            <p class="text-slate-400 mt-2">Генерирай вирусни сценарии за Reels, TikTok & Shorts за секунди.</p>
        </header>

        <!-- Поле за OpenAI ключ -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 mb-6 flex items-center gap-4 shadow-lg">
            <span class="text-sm text-purple-400 font-semibold">OpenAI API Key:</span>
            <input type="password" id="apiKey" placeholder="sk-..." class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white flex-1 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Форма -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Тема или Продукт</label>
                    <input type="text" id="topic" placeholder="напр. Автомобилен детайлинг" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Целева публика</label>
                    <input type="text" id="audience" placeholder="напр. Собственици на коли" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Платформа</label>
                    <select id="platform" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="TikTok">TikTok</option>
                        <option value="Instagram Reels">Instagram Reels</option>
                        <option value="YouTube Shorts">YouTube Shorts</option>
                    </select>
                </div>
                <button onclick="generateScript()" id="genBtn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg font-bold hover:opacity-90 transition cursor-pointer">
                    ⚡ Генерирай Сценарий
                </button>
            </div>

            <!-- Резултат -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 min-h-[400px]" id="resultContainer">
                <div class="h-full flex items-center justify-center text-slate-500 text-center" id="placeholderText">
                    Въведи API ключ отгоре, попълни формата и натисни бутона, за да видиш сценария тук.
                </div>
            </div>
        </div>
    </div>

    <script>
    async function generateScript() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const topic = document.getElementById('topic').value.trim();
        const audience = document.getElementById('audience').value.trim();
        const platform = document.getElementById('platform').value;

        if (!apiKey) {
            alert('Моля, въведи своя OpenAI API ключ в полето най-горе!');
            return;
        }
        if (!topic) {
            alert('Моля, въведи тема или продукт!');
            return;
        }

        const btn = document.getElementById('genBtn');
        const resultContainer = document.getElementById('resultContainer');
        btn.innerText = '⚡ Генериране...';
        btn.disabled = true;

        try {
            const systemPrompt = "Ти си експерт по вирусно кратко видео съдържание за TikTok, Reels и Shorts. Върни резултата СТРИКТНО във валиден JSON формат с ключове: title, hook, hook_visual, script_body (масив с timestamp, spoken_text, b_roll_visual), call_to_action, caption_hashtags.";
            const userPrompt = `Създай вирусен сценарий за ${platform}. Тема: ${topic}. Целева публика: ${audience || 'Обща'}.`;

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    response_format: { type: "json_object" },
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userPrompt }
                    ],
                    temperature: 0.7
                })
            });

            const data = await response.json();
            if (data.error) {
                alert('Грешка от OpenAI: ' + data.error.message);
                btn.innerText = '⚡ Генерирай Сценарий';
                btn.disabled = false;
                return;
            }

            const result = JSON.parse(data.choices[0].message.content);

            resultContainer.innerHTML = `
                <div class="space-y-4 text-sm">
                    <div class="border-b border-slate-800 pb-3">
                        <span class="text-xs uppercase bg-purple-900/50 text-purple-300 px-2 py-1 rounded">Заглавие</span>
                        <h3 class="text-lg font-bold mt-1">${result.title}</h3>
                    </div>
                    <div class="bg-purple-950/40 p-3 rounded-lg border border-purple-800/40">
                        <span class="text-xs text-purple-400 font-bold uppercase">🎯 Hook (Първи 3 сек):</span>
                        <p class="font-semibold text-white mt-1">"${result.hook}"</p>
                        <p class="text-xs text-slate-400 mt-1">🎥 Кадър: ${result.hook_visual}</p>
                    </div>
                    <div class="space-y-2">
                        <span class="text-xs text-slate-400 uppercase font-bold">🎬 Сценарий:</span>
                        ${result.script_body.map(item => `
                            <div class="bg-slate-800/50 p-2.5 rounded border border-slate-700/50">
                                <p class="text-xs text-purple-400">${item.timestamp}</p>
                                <p class="text-slate-200 mt-0.5">"${item.spoken_text}"</p>
                                <p class="text-xs text-slate-400 italic mt-1">B-Roll: ${item.b_roll_visual}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div class="pt-2">
                        <span class="text-xs text-pink-400 font-bold uppercase">📣 CTA:</span>
                        <p class="text-slate-300">${result.call_to_action}</p>
                    </div>
                </div>
            `;
        } catch (err) {
            alert('Възникна грешка при връзката със сървъра.');
            console.error(err);
        } finally {
            btn.innerText = '⚡ Генерирай Сценарий';
            btn.disabled = false;
        }
    }
    </script>
</body>
</html>
